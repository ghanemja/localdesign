[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localdesign"
version = "0.2.0"
description = "A local, provider-agnostic take on Claude Design: prompt -> UI mockups on an infinite canvas, iterate by chat, export HTML. Works with Ollama, LM Studio, vLLM, any OpenAI-compatible endpoint, or Anthropic."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/ghanemja/localdesign"
Issues = "https://github.com/ghanemja/localdesign/issues"

[project.scripts]
lde = "localdesign.server:main"
localdesign = "localdesign.server:main"

[tool.setuptools.packages.find]
include = ["localdesign*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
localdesign = ["static/*"]
