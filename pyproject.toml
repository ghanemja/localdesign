[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localdesign"
version = "0.3.0"
description = "Offline AI UI design for teams whose work can't leave the building: prompt -> screens on a canvas, edit by hand or chat, implementation pack for coding agents. Small local models (Ollama, vLLM, LM Studio) or any OpenAI-compatible / Anthropic endpoint. Zero dependencies."
keywords = ["ui design", "mockups", "llm", "ollama", "local-first", "air-gapped", "prototyping", "design system", "DESIGN.md"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics :: Editors",
  "Topic :: Software Development :: User Interfaces",
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/ghanemja/localdesign"
Issues = "https://github.com/ghanemja/localdesign/issues"

[project.scripts]
lde = "localdesign.server:main"
localdesign = "localdesign.server:main"

[tool.setuptools.packages.find]
include = ["localdesign*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
localdesign = ["static/*"]
